<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Animations -->
    <style>
      .pulse-dot {
        animation: pulseAnimation 2s infinite ease-in-out;
      }
      .pulse-glow {
        animation: glowAnimation 3s infinite alternate ease-in-out;
      }
      .packet-flow-1 {
        stroke-dasharray: 8, 8;
        animation: dashMove 1.5s linear infinite;
      }
      .packet-flow-2 {
        stroke-dasharray: 8, 8;
        animation: dashMove 1.5s linear infinite reverse;
      }
      .bar-anim-1 {
        animation: barGrow1 4s infinite ease-in-out;
        transform-origin: bottom;
      }
      .bar-anim-2 {
        animation: barGrow2 4s infinite ease-in-out;
        transform-origin: bottom;
      }
      .bar-anim-3 {
        animation: barGrow3 4s infinite ease-in-out;
        transform-origin: bottom;
      }
      .shimmer {
        animation: shimmerMove 3s infinite linear;
      }

      @keyframes pulseAnimation {
        0% { r: 4; opacity: 1; }
        50% { r: 8; opacity: 0.4; }
        100% { r: 4; opacity: 1; }
      }
      @keyframes glowAnimation {
        0% { opacity: 0.3; filter: drop-shadow(0 0 4px #0284c7); }
        100% { opacity: 0.9; filter: drop-shadow(0 0 14px #38bdf8); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -32; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 75px; y: 255px; }
        50% { height: 95px; y: 235px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 40px; y: 290px; }
        50% { height: 60px; y: 270px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 85px; y: 245px; }
        50% { height: 65px; y: 265px; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="420" rx="24" fill="url(#bgGradient)"/>
  <rect width="958" height="418" x="1" y="1" rx="23" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Background Grid Subtle Patterns -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="80" x2="920" y2="80"/>
    <line x1="40" y1="160" x2="920" y2="160"/>
    <line x1="40" y1="240" x2="920" y2="240"/>
    <line x1="40" y1="320" x2="920" y2="320"/>
    <line x1="160" y1="40" x2="160" y2="380"/>
    <line x1="320" y1="40" x2="320" y2="380"/>
    <line x1="480" y1="40" x2="480" y2="380"/>
    <line x1="640" y1="40" x2="640" y2="380"/>
    <line x1="800" y1="40" x2="800" y2="380"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 28)">
    <rect width="36" height="36" rx="10" fill="#0284c7" filter="url(#glow)"/>
    <circle cx="18" cy="18" r="9" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M18 12 L18 18 L22 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="0.5">SIPEDA FT UNSOED &bull; LIVE FINANCIAL ENGINE</text>
    <text x="48" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Atomic Budget Locking &bull; Proactive EWS &bull; 7 Roles RBAC</text>

    <!-- Live Status Pill -->
    <g transform="translate(740, 4)">
      <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
      <circle cx="16" cy="14" r="5" fill="#10b981" class="pulse-dot"/>
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">SYSTEM ACTIVE</text>
    </g>
  </g>

  <!-- 4 Top KPI Cards Grid -->
  <g transform="translate(40, 80)">
    <!-- KPI 1: Pagu Aktif -->
    <g transform="translate(0, 0)">
      <rect width="205" height="74" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">TOTAL PAGU ALOKASI</text>
      <text x="16" y="50" font-family="'Courier New', monospace, sans-serif" font-size="17" font-weight="900" fill="#ffffff">Rp 12.500.000.000</text>
      <rect x="16" y="60" width="173" height="4" rx="2" fill="#334155"/>
      <rect x="16" y="60" width="173" height="4" rx="2" fill="url(#skyGrad)"/>
    </g>

    <!-- KPI 2: Realisasi -->
    <g transform="translate(225, 0)">
      <rect width="205" height="74" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">REALISASI PENYERAPAN</text>
      <text x="16" y="50" font-family="'Courier New', monospace, sans-serif" font-size="17" font-weight="900" fill="#34d399">Rp 5.200.000.000</text>
      <rect x="16" y="60" width="173" height="4" rx="2" fill="#334155"/>
      <rect x="16" y="60" width="72" height="4" rx="2" fill="url(#emeraldGrad)"/>
      <text x="160" y="50" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#10b981">41.6%</text>
    </g>

    <!-- KPI 3: Komitmen Reserved -->
    <g transform="translate(450, 0)">
      <rect width="205" height="74" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">KOMITMEN (LOCKED)</text>
      <text x="16" y="50" font-family="'Courier New', monospace, sans-serif" font-size="17" font-weight="900" fill="#38bdf8">Rp 2.100.000.000</text>
      <rect x="16" y="60" width="173" height="4" rx="2" fill="#334155"/>
      <rect x="16" y="60" width="30" height="4" rx="2" fill="url(#skyGrad)"/>
      <text x="160" y="50" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">16.8%</text>
    </g>

    <!-- KPI 4: Sisa Saldo Bebas -->
    <g transform="translate(675, 0)">
      <rect width="205" height="74" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SALDO TERSEDIA (FREE)</text>
      <text x="16" y="50" font-family="'Courier New', monospace, sans-serif" font-size="17" font-weight="900" fill="#fbbf24">Rp 5.200.000.000</text>
      <rect x="16" y="60" width="173" height="4" rx="2" fill="#334155"/>
      <rect x="16" y="60" width="72" height="4" rx="2" fill="url(#amberGrad)"/>
      <text x="160" y="50" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#f59e0b">41.6%</text>
    </g>
  </g>

  <!-- Left Chart Box: 3-Bar Comparative Distribution -->
  <g transform="translate(40, 175)">
    <rect width="320" height="215" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff">DISTRIBUSI PAGU TERKINI</text>
    <text x="20" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Real-time Comparative 3-Bar Engine</text>

    <!-- Base Axis Line -->
    <line x1="30" y1="160" x2="290" y2="160" stroke="#475569" stroke-width="1.5"/>

    <!-- Bar 1: Realisasi -->
    <g transform="translate(60, 0)">
      <rect x="0" y="75" width="44" height="85" rx="8" fill="url(#emeraldGrad)" class="bar-anim-1"/>
      <text x="22" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#34d399">41.6%</text>
      <text x="22" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Realisasi</text>
      <text x="22" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="600" fill="#64748b">Rp 5,2 M</text>
    </g>

    <!-- Bar 2: Komitmen -->
    <g transform="translate(138, 0)">
      <rect x="0" y="115" width="44" height="45" rx="8" fill="url(#skyGrad)" class="bar-anim-2"/>
      <text x="22" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">16.8%</text>
      <text x="22" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Komitmen</text>
      <text x="22" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="600" fill="#64748b">Rp 2,1 M</text>
    </g>

    <!-- Bar 3: Saldo Bebas -->
    <g transform="translate(216, 0)">
      <rect x="0" y="75" width="44" height="85" rx="8" fill="url(#amberGrad)" class="bar-anim-3"/>
      <text x="22" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#fbbf24">41.6%</text>
      <text x="22" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Sisa Bebas</text>
      <text x="22" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="600" fill="#64748b">Rp 5,2 M</text>
    </g>
  </g>

  <!-- Right Workflow & EWS Pipeline Card -->
  <g transform="translate(380, 175)">
    <rect width="540" height="215" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff">ALUR WORKFLOW & KONTROL TRANSAKSI</text>
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Siklus Hidup Transaksi Otomatis dengan Validasi Rule Engine</text>

    <!-- Workflow Nodes Pipeline -->
    <g transform="translate(24, 64)">
      <!-- Step 1: PTK Unit -->
      <g transform="translate(0, 0)">
        <rect width="90" height="42" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
        <text x="45" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">PTK UNIT</text>
        <text x="45" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">Draft Usulan</text>
      </g>

      <!-- Connecting Arrow 1 -->
      <line x1="94" y1="21" x2="128" y2="21" stroke="#38bdf8" stroke-width="2" class="packet-flow-1"/>

      <!-- Step 2: KAJUR / PTU -->
      <g transform="translate(132, 0)">
        <rect width="105" height="42" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
        <text x="52" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#818cf8">KAJUR &bull; PTU</text>
        <text x="52" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">Review SPJ</text>
      </g>

      <!-- Connecting Arrow 2 -->
      <line x1="241" y1="21" x2="275" y2="21" stroke="#818cf8" stroke-width="2" class="packet-flow-1"/>

      <!-- Step 3: KABAG Keuangan (Locking) -->
      <g transform="translate(279, 0)">
        <rect width="105" height="42" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
        <text x="52" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#fbbf24">KABAG KEUANGAN</text>
        <text x="52" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#fcd34d">Lock Reserved</text>
      </g>

      <!-- Connecting Arrow 3 -->
      <line x1="388" y1="21" x2="422" y2="21" stroke="#10b981" stroke-width="2" class="packet-flow-1"/>

      <!-- Step 4: Realisasi Selesai -->
      <g transform="translate(426, 0)">
        <rect width="66" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <text x="33" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#34d399">CAIR</text>
        <text x="33" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#a7f3d0">Completed</text>
      </g>
    </g>

    <!-- Bottom Alerts / EWS Live Box inside Card -->
    <g transform="translate(24, 128)">
      <!-- EWS Banner -->
      <rect width="492" height="64" rx="12" fill="#450a0a" stroke="#e11d48" stroke-width="1.2" opacity="0.9"/>
      
      <circle cx="26" cy="32" r="6" fill="#f43f5e" class="pulse-dot"/>
      
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fda4af">EARLY WARNING ALERT (EWS-001)</text>
      <text x="44" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Mata Anggaran 521111 (Jurusan Mesin) tersisa 14.2% (&lt; 15% ambang batas kritis).</text>
      <text x="44" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#fca5a5">Rule Engine secara otomatis mengirimkan notifikasi ke Dekan &amp; WD II.</text>

      <rect x="400" y="20" width="80" height="24" rx="12" fill="#be123c"/>
      <text x="440" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">ACTION REQD</text>
    </g>
  </g>
</svg>
